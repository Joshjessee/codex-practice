<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klondike Solitaire</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <header>
      <h1>Klondike Solitaire</h1>
      <div class="controls">
        <button id="new-game">New Game</button>
        <button id="draw-card">Draw</button>
      </div>
    </header>

    <section class="top-row">
      <div class="pile-group">
        <div class="pile-label">Stock</div>
        <div id="stock" class="pile card-slot"></div>
      </div>

      <div class="pile-group">
        <div class="pile-label">Waste</div>
        <div id="waste" class="pile card-slot"></div>
      </div>

      <div class="foundations">
        <div class="pile-group">
          <div class="pile-label">♠</div>
          <div class="pile foundation card-slot" data-suit="spades"></div>
        </div>
        <div class="pile-group">
          <div class="pile-label">♥</div>
          <div class="pile foundation card-slot" data-suit="hearts"></div>
        </div>
        <div class="pile-group">
          <div class="pile-label">♦</div>
          <div class="pile foundation card-slot" data-suit="diamonds"></div>
        </div>
        <div class="pile-group">
          <div class="pile-label">♣</div>
          <div class="pile foundation card-slot" data-suit="clubs"></div>
        </div>
      </div>
    </section>

    <section id="tableau" class="tableau"></section>

    <p id="status" class="status" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
